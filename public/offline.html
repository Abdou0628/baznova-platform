<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HireNova — Hors ligne</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #ecfdf5 0%, #ffffff 50%, #f0fdf4 100%);
      color: #1e293b;
      text-align: center;
      padding: 1.5rem;
    }
    .card {
      background: #fff;
      border-radius: 1rem;
      box-shadow: 0 4px 24px rgba(0,0,0,.06);
      padding: 3rem 2rem;
      max-width: 420px;
      width: 100%;
    }
    .icon {
      width: 64px; height: 64px;
      margin: 0 auto 1.25rem;
      background: #d1fae5;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .icon svg { width: 32px; height: 32px; stroke: #059669; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    h1 { font-size: 1.35rem; margin-bottom: .5rem; color: #059669; }
    p { font-size: .95rem; color: #64748b; line-height: 1.6; margin-bottom: 1.5rem; }
    button {
      display: inline-flex; align-items: center; gap: .5rem;
      background: #059669; color: #fff; border: none; border-radius: .5rem;
      padding: .75rem 1.5rem; font-size: .95rem; font-weight: 600;
      cursor: pointer; transition: background .2s;
    }
    button:hover { background: #047857; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24"><path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.56 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></svg>
    </div>
    <h1>Vous êtes hors ligne</h1>
    <p>HireNova a besoin d'une connexion Internet pour générer vos documents et accéder aux offres d'emploi. Vérifiez votre connexion et réessayez.</p>
    <button onclick="window.location.reload()">↻  Réessayer</button>
  </div>
</body>
</html>
